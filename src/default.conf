# finedesktop default config. Your file ($XDG_CONFIG_HOME/finedesktop/config) is applied on top of this.
# Format: `key = value`, `bind = MODS, key, action...`, `unbind = MODS, key`, `exec = command` (autostart).

mod = super
terminal = foot
menu = ~/.config/src/menu
mfact = 0.55
nmaster = 1
layout = tile
workspaces = 9
theme = matrix
bar = top
# one line: audio | machine | time. `|` is a separator; also tags layout (the current layout name) bat and your own widgets (see examples/)
bar_left = tags layout
bar_right = notify spk mic | cpu-graph gpu-graph ram-graph vram-graph | disk-bar disk | date time

bind = mod, Return, spawn $terminal
bind = mod, w, menu launch
bind = mod+shift, w, menu toggle
bind = mod, q, close
bind = mod+shift, c, close
bind = mod+shift, q, quit
bind = mod+shift, r, reload

bind = mod, j, focus next
bind = mod, k, focus prev
bind = mod+shift, Return, zoom

bind = mod, space, layout next
bind = mod+shift, space, layout prev
bind = mod, t, layout tile
bind = mod, f, layout float
bind = mod, m, layout monocle
bind = mod+shift, s, layout deck
bind = mod, g, layout grid
bind = mod, s, layout stack
bind = mod, y, layout tab
bind = mod, r, layout spiral

# as in the old dwl: Super+h/l is volume, Ctrl+Super+h/l resizes the master
bind = mod, h, spawn wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = mod, l, spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = mod+ctrl, h, mfact -0.05
bind = mod+ctrl, l, mfact +0.05
bind = mod, i, nmaster +1
bind = mod, d, nmaster -1
bind = , XF86AudioRaiseVolume, spawn wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = mod, Left, focus left
bind = mod, Right, focus right
bind = mod, Up, focus up
bind = mod, Down, focus down
bind = mod+shift, Left, move left
bind = mod+shift, Right, move right
bind = mod+shift, Up, move up
bind = mod+shift, Down, move down
bind = mod, Tab, focus last
bind = mod, bracketleft, focus prev
bind = mod, bracketright, focus next
bind = mod+shift, w, spawn emacsclient -c -a ""
bind = , Print, spawn shot
bind = mod, Print, spawn shot area
bind = mod+shift, b, bar toggle
bind = mod, F1, welcome toggle
bind = mod, slash, welcome toggle

bind = mod, z, view prev
bind = mod, x, view next
bind = mod+shift, z, tag prev
bind = mod+shift, x, tag next
bind = mod, comma, monitor focus prev
bind = mod, period, monitor focus next
bind = mod+shift, comma, monitor send prev
bind = mod+shift, period, monitor send next

bind = mod, 1, view 1
bind = mod, 2, view 2
bind = mod, 3, view 3
bind = mod, 4, view 4
bind = mod, 5, view 5
bind = mod, 6, view 6
bind = mod, 7, view 7
bind = mod, 8, view 8
bind = mod, 9, view 9
bind = mod+shift, 1, tag 1
bind = mod+shift, 2, tag 2
bind = mod+shift, 3, tag 3
bind = mod+shift, 4, tag 4
bind = mod+shift, 5, tag 5
bind = mod+shift, 6, tag 6
bind = mod+shift, 7, tag 7
bind = mod+shift, 8, tag 8
bind = mod+shift, 9, tag 9

# welcome widget: the key list is built from the binds above, shown on an empty workspace (Super+F1 toggles).
# Add as many markdown files as you like:  welcome = ~/notes/todo.md
# or drop *.md into ~/.config/finedesktop/welcome/   (welcome_keys = off hides the key list, welcome_auto = off stops auto-show)

# lock = loginctl lock-session      # what `ctl session lock` runs
# ctl_deny = spawn quit session     # refuse these when they arrive over ctl (scripts, agents); keys still work

# rule = firefox ws=2 name=web       # a window by app id: start on workspace 2, tab label "web" (trailing * = prefix)
# disk = /data                       # which disk the `disk` (free space) and `disk-bar` (used, as a bar) bar items show
# plain numbers instead of graphs: bar_right = notify spk mic | cpu gpu ram vram | disk | date time   (cpu-graph gpu-graph ram-graph vram-graph = last 30 s as a mini graph; disk-bar = used, disk = free)
# low_battery = 15                   # one notification at this percent while discharging (0 = off)
