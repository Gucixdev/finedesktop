# finedesktop default config. Your file ($XDG_CONFIG_HOME/finedesktop/config) is applied on top of this.
# Format: `key = value`, `bind = MODS, key, action...`, `unbind = MODS, key`, `exec = command` (autostart).

mod = super
terminal = foot
menu = ~/.config/src/menu
mfact = 0.55
nmaster = 1
layout = tile
workspaces = 9
theme = dwl
bar = top
bar_left = tags layout title
bar_right = cpu ram vol bat clock

bind = mod, Return, spawn $terminal
bind = mod, w, spawn $menu
bind = mod, q, close
bind = mod+shift, c, close
bind = mod+shift, q, quit
bind = mod+shift, r, reload

bind = mod, j, focus next
bind = mod, k, focus prev
bind = mod, Down, focus next
bind = mod, Up, focus prev
bind = mod+shift, Return, zoom

bind = mod, space, layout next
bind = mod+shift, space, layout prev
bind = mod, t, layout tile
bind = mod, f, layout float
bind = mod, m, layout monocle
bind = mod, d, layout deck
bind = mod, g, layout grid
bind = mod, s, layout stack
bind = mod, y, layout tab

bind = mod, h, mfact -0.05
bind = mod, l, mfact +0.05
bind = mod, i, nmaster +1
bind = mod+shift, i, nmaster -1

bind = mod, z, view prev
bind = mod, x, view next
bind = mod+shift, z, tag prev
bind = mod+shift, x, tag next
bind = mod, comma, monitor focus prev
bind = mod, period, monitor focus next
bind = mod+shift, comma, monitor send prev
bind = mod+shift, period, monitor send next

bind = mod, 1, view 1
bind = mod, 2, view 2
bind = mod, 3, view 3
bind = mod, 4, view 4
bind = mod, 5, view 5
bind = mod, 6, view 6
bind = mod, 7, view 7
bind = mod, 8, view 8
bind = mod, 9, view 9
bind = mod+shift, 1, tag 1
bind = mod+shift, 2, tag 2
bind = mod+shift, 3, tag 3
bind = mod+shift, 4, tag 4
bind = mod+shift, 5, tag 5
bind = mod+shift, 6, tag 6
bind = mod+shift, 7, tag 7
bind = mod+shift, 8, tag 8
bind = mod+shift, 9, tag 9
