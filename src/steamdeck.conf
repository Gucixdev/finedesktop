# Steam Deck preset: 1280x800 handheld, touchscreen and trackpads, games first. Applied on top of default.conf when the machine
# is a Deck (DMI product Jupiter or Galileo) or FD_PROFILE=steamdeck; your own config file still wins over it.
# Not run on a real Deck yet: the numbers are made for 1280x800 at 7 inches and want a first look.

# readable from arm's length: the bitmap font doubled, tall bars, fat borders so the focused window is obvious
font_scale = 2
tab_height = 34
border = 3
gap = 10
theme = steam

# one big window with one more beside it: `list` shows the master and ONE of the rest, the way a handheld is used
layout = list
mfact = 0.62
nmaster = 1
workspaces = 4

# the bar on top, away from the thumbs and a stray touch; only what a handheld needs
bar = top
clock_format = %H:%M
bar_left = tags layout
bar_right = notify spk bat | cpu-graph ram-graph | time
low_battery = 20

# trackpads behave like phones, not laptops
tap_to_click = on
natural_scroll = on
pointer_speed = 0.2
mouse_follows_focus = off
focus_follows_mouse = off
anim_speed = 1.0

# the buttons Steam Input sends in desktop mode: Steam/QAM as Super combos, the volume rocker as the usual keys
bind = mod, Return, spawn $terminal
bind = mod, w, menu launch
bind = mod, Tab, focus last
bind = mod, space, layout next
bind = mod, m, layout monocle
bind = mod, l, layout list
bind = mod, bracketleft, view prev
bind = mod, bracketright, view next
bind = , XF86MonBrightnessUp, spawn brightnessctl set 10%+
bind = , XF86MonBrightnessDown, spawn brightnessctl set 10%-
