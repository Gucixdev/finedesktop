name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >
          sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
          libinput-dev libudev-dev libseat-dev libgbm-dev libdrm-dev libegl1-mesa-dev pkg-config
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
