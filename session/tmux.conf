# Config of the terminal-window sessions (see fd-shell): invisible by default, so a terminal looks like a plain one.
set -g status off
set -g prefix None
unbind C-b
set -g history-limit 100000
set -g mouse on
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",foot*:RGB,xterm*:RGB"
set -g set-clipboard on
set -g allow-passthrough on
set -g destroy-unattached off
set -g exit-empty on
# the wheel scrolls the history (copy mode), q or the bottom of the history leaves it
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e"
